{% extends "base.html" %}
{% block title %}Staff Sign In{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <h1 class="h2 mb-4">Staff sign in</h1>
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control" type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-cta w-100" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
