{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container text-center" style="max-width: 640px;">
    <div class="info-card">
      <div class="icon mx-auto"><i class="bi bi-hourglass-split" aria-hidden="true"></i></div>
      <h1 class="h2">{{ title }}</h1>
      <p class="lead">{{ message }}</p>
      <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
        <a class="btn btn-accent" href="tel:{{ firm.phone_href }}"><i class="bi bi-telephone" aria-hidden="true"></i> {{ firm.phone }}</a>
        <a class="btn btn-outline-ink" href="{{ url_for('contact') }}">Send a message</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
